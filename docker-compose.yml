services:
  postgres:
    image: postgres:16-alpine
    container_name: naturotopia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: naturotopia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - naturotopia_pgdata:/var/lib/postgresql/data

volumes:
  naturotopia_pgdata:
